name: holidaypark-monitor

on:
  schedule:
    # Co 10 minut. GitHub czasem opóźnia o kilka minut, to normalne.
    - cron: "*/10 * * * *"
  workflow_dispatch: # pozwala odpalić ręcznie z UI GitHuba

permissions:
  contents: write # potrzebne żeby commitować state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "update state [skip ci]"
          git push || true
